[project]
name = "trustgraph-dfl"
version = "0.1.0"
description = "TrustGraph-DFL decentralized federated learning reproduction, FPR study, and distributed system benchmark"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
